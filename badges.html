<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📿 Beads & Co. — Your Trophy Room</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { overflow-y: auto !important; height: auto !important; }
        .score-banner-card { background: linear-gradient(135deg, var(--logo-mint) 0%, #FFFFFF 100%); padding: 30px; border-radius: 24px; border: 3px solid #FFFFFF; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.02); }
        .score-circle { width: 90px; height: 90px; background: var(--text-plum); color: #FFF; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; border: 4px solid var(--logo-yellow); }
        .badges-showcase-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 25px; }
        .badge-detail-card { background: #FFFFFF; border-radius: 20px; padding: 25px; display: flex; gap: 15px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.01); border: 2px solid transparent; }
        .card-earned { border-color: var(--logo-pink) !important; background: #FFFFFF !important; box-shadow: 0 8px 25px rgba(255, 127, 165, 0.08) !important; }
        .card-locked { background: #F8F9FA !important; border-color: var(--bg-mint) !important; opacity: 0.7; }
    </style>
</head>
<body class="scrollable-body">
    <div class="shop-split-page">
        <!-- NAVIGATION PANEL -->
        <div class="sidebar">
            <div class="logo-box"><div class="logo-bead"></div><h2>Beads & Co.</h2></div>
            <div class="menu-buttons">
                <a href="index.html" class="menu-item">🏠 Store Home</a>
                <a href="games.html" class="menu-item">🎮 Kids' Fun Zone</a>
                <a href="badges.html" class="menu-item active">🏆 Trophy Room</a>
            </div>
            <div class="user-box" id="user-status-display">Mode: Customer</div>
        </div>

        <div class="shop-scroll-view">
            <div class="score-banner-card">
                <div>
                    <h1 style="font-size: 26px; font-weight: 800; margin: 0;">🏆 Master Artisan Badge Room</h1>
                    <p style="color: var(--gray-text); margin-top: 4px; font-size: 13px;">Play matching levels to change locked gray cards into beautiful rewards!</p>
                    <button onclick="localStorage.removeItem('kids_unlocked_badges'); location.reload();" style="margin-top:10px; background:none; border:none; color:var(--logo-pink); font-size:11px; font-weight:bold; cursor:pointer; text-decoration:underline;">🗑️ Restart Trophies Challenge</button>
                </div>
                <div class="score-circle">
                    <span id="child-total-xp" style="font-size: 24px; color: var(--logo-yellow);">0</span>
                    <span style="font-size: 8px; color: var(--logo-mint);">TOTAL XP</span>
                </div>
            </div>

            <!-- CARD COMPILER GOAL WINDOW -->
            <div class="badges-showcase-grid" id="full-badges-grid-target"></div>
        </div>
    </div>

    <!-- LINK INJECTION SCRIPTS -->
    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const target = document.getElementById("full-badges-grid-target");
            const xpText = document.getElementById("child-total-xp");
            if(!target || !xpText) return;
            
            let unlocked = JSON.parse(localStorage.getItem("kids_unlocked_badges")) || [];
            let currentXP = 0;
            target.innerHTML = "";
            
            // Re-use the master badges database configured in script.js
            // REPLACE THE localBadgesCopy OBJECT INSIDE BADGES.HTML WITH THIS EXPANDED COLLECTION:
const localBadgesCopy = {
    first_pop: { title: "Bead Popper Cadet", icon: "🎈", desc: "Popped your very first dancing bead inside the arcade grid canvas layout!" },
    speed_popper: { title: "Laser Reflexes", icon: "⚡", desc: "Tapped a quick-click sequence element block down in record time!" },
    riddle_cracker: { title: "Puzzle Detective", icon: "🕵️", desc: "Cracked the grand storefront operator riddle choice board correctly!" },
    lucky_spinner: { title: "Charm Collector", icon: "🦄", desc: "Spun the random accessory spindle to select a lucky accent spacer!" },
    pattern_pro: { title: "Pattern Architect", icon: "📐", desc: "Aligned standard rainbow color alternating sequences perfectly!" },
    matching_wizard: { title: "Color Wizard", icon: "🎨", desc: "Sorted colorful seed bead materials cleanly inside active boxes!" },
    music_maestro: { title: "Chime Composer", icon: "🎵", desc: "Struck musical blocks to compose a beautiful chiming harmony sequence!" },
    tic_tac_champ: { title: "Bot Crusher AI", icon: "🤖", desc: "Out-maneuvered our storefront robot assistant inside the tactical grid!" },
    pixel_picasso: { title: "8-Bit Designer", icon: "👾", desc: "Painted individual block cells to design a retro pixel heart art piece!" },
    speed_catcher: { title: "Gravity Master", icon: "🚀", desc: "Caught a falling flying unicorn token before it crossed screen borders!" },
    jewelry_boss: { title: "Boutique Tycoon", icon: "👑", desc: "Passed the final studio boss exam to claim your ultimate golden crown!" }
};


            Object.keys(localBadgesCopy).forEach(key => {
                let gotIt = unlocked.includes(key);
                let score = key === 'jewelry_boss' ? 100 : (key === 'speed_popper' || key === 'pattern_pro' || key === 'matching_wizard' ? 30 : 15);
                if (gotIt) currentXP += score;
                
                let card = document.createElement("div");
                card.className = `badge-detail-card ${gotIt ? 'card-earned' : 'card-locked'}`;
                card.innerHTML = `
                    <div style="font-size:44px; filter:${gotIt ? 'none' : 'grayscale(100%) opacity(25%)'};">${localBadgesCopy[key].icon}</div>
                    <div style="flex:1;">
                        <h4 style="margin:0; font-size:14px; color:${gotIt ? 'var(--text-plum)' : 'var(--gray-text)'};">${localBadgesCopy[key].title}</h4>
                        <p style="margin:2px 0 0 0; font-size:11px; color:var(--gray-text); line-height:1.3;">${localBadgesCopy[key].desc}</p>
                    </div>
                    <div style="font-size:11px; font-weight:bold; background:${gotIt ? 'var(--logo-yellow)' : '#EBEBEB'}; padding:4px 8px; border-radius:8px;">+${score} XP</div>
                `;
                target.appendChild(card);
            });
            xpText.textContent = currentXP;
        });
    </script>
</body>
</html>
